[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Post-processing
#
# Pretty URLs is Netlify's automatic trailing-slash canonicalisation: with it
# on, /insights/ is answered with a 301 to /insights even when a file sits at
# that exact path. The old advrt.co.uk build redirected the other way, so any
# browser still holding that cached 301 bounces between the two and shows
# "this page can't be found" before it settles.
#
# It runs ahead of the custom rules below, which is why neither a `status =
# 200` rewrite nor the dual-path output in scripts/dual-paths.mjs could stop
# it. Turning it off leaves both forms answering 200 from a real file, so a
# stale redirect in either direction terminates on the first hop. The canonical
# tag, the sitemap and every internal link still use the bare form, so there is
# still exactly one indexable URL per page.
# ---------------------------------------------------------------------------
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

# ---------------------------------------------------------------------------
# Headers
#
# Netlify applies every matching rule, and when two rules set the same header
# the LAST match wins. So the broad /* rule goes first and the specific
# long-cache rules follow, otherwise /* would reset their Cache-Control.
# ---------------------------------------------------------------------------

# HTML: always revalidate so content edits appear immediately, but allow the
# CDN to serve instantly while it checks.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # Fonts, styles and scripts are all self-hosted. Two third parties are
    # allowed: Google Tag Manager, which the consent banner injects after an
    # explicit opt-in and which hosts GA4 and any other tag,
    # and the GoHighLevel booking calendar on /start-a-project — its iframe
    # (api.leadconnectorhq.com) and the embed script that sizes it
    # (link.msgsndr.com). The script loads icons from stcdn.leadconnectorhq.com
    # only for the popup launcher, which the inline embed does not use, so that
    # host stays out of img-src.
    #
    # IMPORTANT, and the main cost of running a strict CSP alongside GTM:
    # this policy governs every tag the container fires. Adding a tag in the
    # GTM interface is NOT enough on its own — if it sends to a host that is
    # not listed here, the browser blocks it and the tag silently does
    # nothing, with no sign of a problem in the GTM interface itself.
    #
    # That is not hypothetical. On the first deploy of this container GA4 was
    # blocked outright: GA4 through GTM does not only use
    # google-analytics.com, it also sends to www.google.com/g/collect and
    # stats.g.doubleclick.net, and with ad_storage granted the conversion
    # linker adds ad.doubleclick.net. All of those are listed above now, in
    # both connect-src and img-src, because each endpoint is tried as a fetch
    # and then as an image pixel.
    #
    # Hosts the common additions need, for when one is switched on:
    #   Google Ads conversion   googleadservices.com, googletagmanager.com
    #   Meta pixel              connect.facebook.net (script-src),
    #                           facebook.com (img-src and connect-src)
    #   LinkedIn Insight        snap.licdn.com, px.ads.linkedin.com
    #   Microsoft / Bing UET    bat.bing.com
    # Add the host here and deploy at the same time as the tag goes live, and
    # check the console for a CSP refusal afterwards rather than trusting the
    # GTM preview, which does not enforce this policy.
    #
    # Note the payment=() above: the GHL embed asks for allow="payment" by
    # default, and this policy overrides it. The discovery call is free, so
    # that is the right default — but if the calendar is ever set to take a
    # deposit, the Payment Request API will fail silently until this becomes
    # payment=(self "https://api.leadconnectorhq.com").
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://link.msgsndr.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://stats.g.doubleclick.net https://ad.doubleclick.net; font-src 'self'; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.google.com https://stats.g.doubleclick.net https://ad.doubleclick.net; frame-src https://api.leadconnectorhq.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'"

# Build assets carry a content hash in the filename, so they can never go
# stale. Cache them for a year.
[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

