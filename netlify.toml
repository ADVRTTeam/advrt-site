[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Headers
#
# Netlify applies every matching rule, and when two rules set the same header
# the LAST match wins. So the broad /* rule goes first and the specific
# long-cache rules follow, otherwise /* would reset their Cache-Control.
# ---------------------------------------------------------------------------

# HTML: always revalidate so content edits appear immediately, but allow the
# CDN to serve instantly while it checks.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # Fonts, styles and scripts are all self-hosted. The only third party is
    # GA4, which the consent banner injects after an explicit opt-in and
    # which therefore has to be allowed here. Add a GoHighLevel embed host to
    # frame-src when the booking calendar goes in.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; frame-src 'none'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'"

# Build assets carry a content hash in the filename, so they can never go
# stale. Cache them for a year.
[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

