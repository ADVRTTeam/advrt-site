# Partial matches — the destination is the right company but not the same
# subject, so expect these queries to fade. See CONTENT-PLAN: keeping them as
# real pages is a live decision, not an oversight.

# 478 impressions, position 17.2. "lead generation machine" (128), and
# "lead generation for fire protection companies".
[[redirects]]
  from = "/lead-generation"
