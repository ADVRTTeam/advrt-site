# ---------------------------------------------------------------------------
# Trailing-slash forms
#
# This site moved from directory-style output (/surveyors/) to file-style
# (/surveyors). Browsers that saw the old build cached its permanent redirect
# from /surveyors to /surveyors/ — and a 301 with no Cache-Control is cached
# heuristically, often for good. Left alone, Netlify would then 301 the slashed
# form back to the bare one and the two would ping-pong.
#
# So the slashed form serves the page itself, with status 200 rather than a
# redirect. A stale cached redirect lands on the right content and stops there.
# The canonical tag, the sitemap and every link on the site use the bare form.
# ---------------------------------------------------------------------------

[[redirects]]
