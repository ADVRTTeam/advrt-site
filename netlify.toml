# ---------------------------------------------------------------------------
# Trailing-slash forms
#
# Handled by scripts/dual-paths.mjs, not here: Netlify normalises a trailing
# slash before custom redirect rules are evaluated, so a `status = 200` rewrite
# for /surveyors/ never fires. The build writes both /surveyors.html and
# /surveyors/index.html so each form is an exact asset match and neither
# redirects — which matters because browsers that saw an earlier build cached
# its permanent redirect from the bare path to the slashed one.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Legacy advrt.co.uk URLs
#
# The old site ranks for a lot that the new one would otherwise 404. Twelve
# months of Search Console (pulled 10 Nov 2026) shows these paths carrying
# real impressions, so each is sent to its closest match rather than dropped.
# Impressions and average position are noted so the trade-off is visible.
#
# These only bite once advrt.co.uk points here; on the netlify.app origin
# nothing requests them.
# ---------------------------------------------------------------------------

# Direct topical matches — the equity lands somewhere that answers the query.

# 1,040 impressions, position 20.7. Ranks for "google ads training",
# "google ads certification training provider in uk". The training sector
# page is the closest thing the new site has.
[[redirects]]
  from = "/blog-posts/google-ads-for-uk-training-providers"
  to = "/training"
  status = 301

# 776 impressions, position 31.8 — and its best query is
# "lead generation for training providers" at position 9.3, which is exactly
# the intent the new positioning wants.
[[redirects]]
  from = "/blog-posts/leveraging-social-media-advertising-for-training-course-leads"
  to = "/training"
  status = 301

# 189 impressions, position 9.6. A training-provider case study.
[[redirects]]
  from = "/case-studies/703-leads-in-30-days-for-high-ticket-training-provider"
  to = "/training"
  status = 301

# 659 impressions across two rows, position ~8.
[[redirects]]
  from = "/get-in-touch"
  to = "/contact"
  status = 301

# 237 impressions, position 9.4.
[[redirects]]
  from = "/blog-posts"
  to = "/insights"
  status = 301

# Everything else under the old blog, including posts below the reporting
# threshold.
[[redirects]]
  from = "/blog-posts/*"
  to = "/insights"
  status = 301

[[redirects]]
  from = "/case-studies"
  to = "/#work"
  status = 301

[[redirects]]
  from = "/case-studies/*"
  to = "/#work"
  status = 301

[[redirects]]
  from = "/portfolio"
  to = "/#work"
  status = 301

[[redirects]]
  from = "/our-service"
  to = "/#process"
  status = 301

# Policies.
[[redirects]]
